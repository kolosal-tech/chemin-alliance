# Ressources d'urgence par pays (code ISO majuscule) + repli international.
# Utilisé par le garde-fou DANGER (Gardien) et la redirection du Coach IA :
# en cas de violence/abus/détresse, on oriente AVANT tout LLM vers des relais
# CONCRETS et locaux. Cible prioritaire : francophonie (France + Afrique) +
# lusophone (Brésil/Portugal) + diaspora.
#
# ⚠️ Numéros à FAIRE VÉRIFIER et dater par un humain avant usage critique.
# Format par entrée : general (urgence générale), violence (violences
# conjugales/familiales), child (enfance en danger).

default:
  fr: "En cas de danger immédiat, contacte les secours d'urgence de ton pays (en Europe : 112). Un accompagnateur humain vérifié et des structures spécialisées peuvent t'aider. Tu n'es pas seul·e."
  en: "If you are in immediate danger, call your country's emergency services (in Europe: 112). A verified human companion and specialised services can help. You are not alone."
  es: "Si estás en peligro inmediato, llama a los servicios de emergencia de tu país (en Europa: 112). Un acompañante humano verificado y servicios especializados pueden ayudarte. No estás solo/a."
  pt: "Se estiveres em perigo imediato, liga para os serviços de emergência do teu país (na Europa: 112). Um acompanhante humano verificado e serviços especializados podem ajudar. Não estás sozinho/a."

